# .github/workflows/run.yml
name: CI / Build & Test

# -------------------------------------------------
# When the workflow should be triggered
# -------------------------------------------------
on:
  push:
    branches: [ main, develop ]   # adjust to your branches
  pull_request:
    branches: [ main ]            # run on PRs targeting main
  workflow_dispatch:              # allow manual runs from the UI

# -------------------------------------------------
# Jobs – each job runs in its own VM/container
# -------------------------------------------------
jobs:
  build-and-test:
    runs-on: ubuntu-latest          # OS image (ubuntu, windows, macos)

    # -------------------------------------------------
    # Define a matrix if you need multiple Python versions
    # -------------------------------------------------
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout the repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣ Set up the requested Python version
      # -------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"               # caches pip packages between runs

      # -------------------------------------------------
      # 3️⃣ Install dependencies (adjust to your project)
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you have a requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Or install Poetry / Pipenv / Poetry etc.
          # pip install poetry && poetry install

      # -------------------------------------------------
      # 4️⃣ Run linting (optional but recommended)
      # -------------------------------------------------
      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build if there are style errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # -------------------------------------------------
      # 5️⃣ Run your test suite
      # -------------------------------------------------
      - name: Run tests
        run: |
          # Example using pytest – replace with your test runner
          pip install pytest
          pytest -q

      # -------------------------------------------------
      # 6️⃣ (Optional) Build an artifact – e.g., a wheel or zip
      # -------------------------------------------------
      - name: Build package
        run: |
          pip install build
          python -m build  # creates dist/*.whl and *.tar.gz

      # -------------------------------------------------
      # 7️⃣ Upload the built artifact for later download
      # -------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.python-version }}
          path: dist/*

# -------------------------------------------------
# You can add more jobs (e.g., deploy, security scan) below.
# -------------------------------------------------
